version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Loyalty Rewards — Docker Compose
#
#   LoyaltyRewards-MCPServer      → Port 8000  (MCP SSE + REST API)
#   LoyaltyRewards-TestClient     → Port 8001  (FastAPI Testing Dashboard)
#   LoyaltyRewards-ClaudeClient   → Port 8002  (Claude AI Chat Interface)
# ─────────────────────────────────────────────────────────────────────────────

services:

  mcp-server:
    build:
      context: ./LoyaltyRewards-MCPServer
      dockerfile: Dockerfile
    container_name: loyalty-mcp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - loyalty-data:/data
    environment:
      DB_PATH: /data/loyalty.db
      PYTHONUNBUFFERED: "1"
    networks:
      - loyalty-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  client:
    build:
      context: ./LoyaltyRewards-TestClient
      dockerfile: Dockerfile
    container_name: loyalty-test-client
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      MCP_SERVER_URL: http://mcp-server:8000
      PYTHONUNBUFFERED: "1"
    depends_on:
      mcp-server:
        condition: service_healthy
    networks:
      - loyalty-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  claude-client:
    build:
      context: ./LoyaltyRewards-ClaudeClient
      dockerfile: Dockerfile
    container_name: loyalty-claude-client
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      MCP_SERVER_URL: http://mcp-server:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}   # set in .env or shell
      PYTHONUNBUFFERED: "1"
    depends_on:
      mcp-server:
        condition: service_healthy
    networks:
      - loyalty-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  loyalty-data:
    driver: local

networks:
  loyalty-net:
    driver: bridge
